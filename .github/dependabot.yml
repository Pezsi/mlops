# Dependabot Configuration (Lecke 120)
# Automatically creates pull requests for dependency updates

version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Budapest"
    open-pull-requests-limit: 10
    reviewers:
      - "mlops-team"
    labels:
      - "dependencies"
      - "security"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Group minor and patch updates together
    groups:
      ml-libraries:
        patterns:
          - "scikit-learn"
          - "numpy"
          - "pandas"
          - "joblib"
        update-types:
          - "minor"
          - "patch"
      mlops-tools:
        patterns:
          - "mlflow"
          - "evidently"
        update-types:
          - "minor"
          - "patch"
      web-frameworks:
        patterns:
          - "fastapi"
          - "flask*"
          - "uvicorn"
          - "gunicorn"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "pytest*"
          - "black"
          - "flake8"
        update-types:
          - "minor"
          - "patch"
    # Ignore certain updates
    ignore:
      # Ignore major version updates for critical packages
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
    # Security updates only for these patterns
    allow:
      - dependency-type: "direct"
      - dependency-type: "production"

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
      - "security"
    commit-message:
      prefix: "docker"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci-cd"
      - "security"
    commit-message:
      prefix: "ci"

# Security Alerts Configuration
# Enable security updates for all ecosystems
registries:
  python-pypi:
    type: python-index
    url: https://pypi.org/simple
    replaces-base: true
